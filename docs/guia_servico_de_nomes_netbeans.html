/* ---------------- árvore ---------------- */
function renderTree(){
  const T = $('#tree'); let html = '';
  D.tree.forEach(p => {
    html += '<li><div class="node" style="--d:0" data-tog><span class="tw">▼</span>'+IC.proj+'<span class="nm"><b>'+p.name+'</b></span></div><ul>';
    p.groups.forEach(g => {
      const ids = g.items ? g.items.filter(visible) : [];
      if (g.items && !ids.length) return;
      const anyChg = ids.some(id => statusOf(id) !== 'igual');
      html += '<li'+(g.collapsed?' class="collapsed"':'')+'><div class="node'+(g.items?'':' dim')+'" style="--d:1" '+(g.items?'data-tog':'')+' title="'+esc(g.hint||'')+'"><span class="tw">'+(g.items?(g.collapsed?'▶':'▼'):'▶')+'</span>'+IC[g.icon]+'<span class="nm">'+g.name+'</span>'+(anyChg?'<span class="dot" title="contém mudanças"></span>':'')+'</div>';
      if (g.items){
        const dd = g.sub ? 3 : 2;
        html += '<ul>' + (g.sub ? '<li><div class="node" style="--d:2" data-tog><span class="tw">▼</span>'+IC[g.sub.icon]+'<span class="nm">'+g.sub.name+'</span>'+(anyChg?'<span class="dot"></span>':'')+'</div><ul>' : '');
        ids.forEach(id => {
          const f = D.files[id], st = statusOf(id);
          const cls = st === 'novo' ? 'novo' : st === 'alterado' ? 'alterado' : '';
          const badge = (st === 'novo' ? '<span class="badge novo">NOVO</span>' : st === 'alterado' ? '<span class="badge alterado">ALTERADO</span>' : '');
          html += '<li><div class="node file '+cls+(state.cur===id?' sel':'')+'" style="--d:'+dd+'" data-file="'+id+'" title="'+esc(f.full)+'"><span class="tw"></span>'+iconFor(f)+'<span class="nm">'+f.name+'</span>'+badge+'</div></li>';
        });
        html += (g.sub ? '</ul></li>' : '') + '</ul>';
      }
      html += '</li>';
    });
    html += '</ul></li>';
  });
  T.innerHTML = html;
}
$('#tree').addEventListener('click', e => {
  const n = e.target.closest('.node'); if (!n) return;
  if (n.dataset.file){ openFile(n.dataset.file); if (innerWidth <= 860) $('#left').classList.remove('open'); return; }
  if (n.hasAttribute('data-tog')){ const li = n.parentElement; li.classList.toggle('collapsed'); n.querySelector('.tw').textContent = li.classList.contains('collapsed') ? '▶' : '▼'; }
});

/* ---------------- roteiro ---------------- */
function steps(){ return V().steps; }
function renderSteps(){
  $('#steps').innerHTML = steps().map((s,i) => {
    const tag = s.kind ? '<span class="tag '+s.kind+'">'+({novo:'NOVO',alterado:'ALTERAR',run:'EXECUTAR'}[s.kind]||'')+'</span>' : '';
    return '<li class="step'+(state.step===i?' sel':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span><div class="t">'+tag+esc(s.title)+'</div>'+(s.sub?'<div class="s">'+esc(s.sub)+'</div>':'')+'</span></li>';
  }).join('');
}
$('#steps').addEventListener('click', e => {
  const li = e.target.closest('.step'); if (!li) return;
  const s = steps()[+li.dataset.i]; state.step = +li.dataset.i;
  if (s.file) openFile(s.file, true); else { state.btab = s.tab || 'instr'; if (s.out != null) state.out = s.out; renderBottom(); }
  if (s.file && s.tab){ state.btab = s.tab; renderBottom(); }
  renderSteps();
  if (innerWidth <= 860) $('#left').classList.remove('open');
});

/* ---------------- editor ---------------- */
function openFile(id, fromStep){
  if (!visible(id)) return;
  if (!state.open.includes(id)) state.open.push(id);
  state.cur = id; SS('cur', id);
  if (!fromStep){ const i = steps().findIndex(s => s.file === id); state.step = i >= 0 ? i : null; }
  state.btab = 'instr';
  renderTree(); renderTabs(); renderEditor(); renderBottom(); renderSteps(); renderStatus();
}
function closeFile(id){
  state.open = state.open.filter(x => x !== id);
  if (state.cur === id) state.cur = state.open[state.open.length-1] || null;
  renderTree(); renderTabs(); renderEditor(); renderBottom(); renderStatus();
}
function renderTabs(){
  state.open = state.open.filter(visible);
  if (state.cur && !visible(state.cur)) state.cur = state.open[0] || null;
  $('#etabs').innerHTML = state.open.map(id => {
    const f = D.files[id], st = statusOf(id);
    return '<div class="etab '+(st==='novo'?'novo':st==='alterado'?'alterado':'')+(id===state.cur?' on':'')+'" role="tab" data-id="'+id+'">'+iconFor(f)+'<span class="lbl">'+f.name+'</span><span class="hint" style="color:var(--muted);font-size:11px">'+f.projShort+'</span><button class="x" title="Fechar" data-close="'+id+'">×</button></div>';
  }).join('');
  // a aba ativa sempre fica à vista, mesmo com muitas abas abertas
  const bar = $('#etabs'), on = bar.querySelector('.etab.on');
  if (on){
    const l = on.offsetLeft, r = l + on.offsetWidth;
    if (l < bar.scrollLeft) bar.scrollLeft = l;
    else if (r > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = r - bar.clientWidth;
  }
}
$('#etabs').addEventListener('click', e => {
  const x = e.target.closest('[data-close]'); if (x){ e.stopPropagation(); closeFile(x.dataset.close); return; }
  const t = e.target.closest('.etab'); if (t) openFile(t.dataset.id);
});
// roda do mouse rola as abas na horizontal, como no NetBeans
$('#etabs').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.currentTarget.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive: false});

let hunks = [], hunkIdx = -1;
function buildRows(id, ver){
  const f = D.files[id];
  const base = (f.text.orig == null ? '' : f.text.orig).split('\n');
  const txt = f.text[ver].split('\n');
  if (base[base.length-1] === '') base.pop();
  if (txt[txt.length-1] === '') txt.pop();
  if (f.text.orig == null) return {rows: txt.map(t => ({t, s:'a'})), removedTail:null};
  return classify(base, txt);
}
function foldRanges(rows){
  const r = [], stack = [];
  rows.forEach((row,i) => {
    const m = /\/\/\s*<editor-fold\b([^>]*)>/.exec(row.t);
    if (m){ const d = /desc="([^"]*)"/.exec(m[1]); stack.push({start:i, desc: d ? d[1].trim() : '...', collapsed: /defaultstate="collapsed"/.test(m[1])}); }
    else if (/\/\/\s*<\/editor-fold>/.test(row.t) && stack.length){ const o = stack.pop(); o.end = i; r.push(o); }
  });
  return r;
}
/* Comentário ou linha vazia: sozinhos não justificam um "Copiar bloco" */
function isNoise(t, lang){
  const s = t.trim();
  return !s || (lang === 'xml' ? s.startsWith('<!--') : /^(\/\/|\/\*|\*)/.test(s));
}
/* Blocos de linhas novas/alteradas seguidas; o texto copiado ignora linhas vazias nas pontas */
function changeGroups(rows, lang){
  const groups = []; let cur = null;
  rows.forEach((r,i) => {
    if ((r.s==='a'||r.s==='m') && !r.ghost){ if (cur) cur.end = i; else groups.push(cur = {start:i, end:i}); }
    else cur = null;
  });
  groups.forEach(g => {
    const idx = []; for (let i=g.start;i<=g.end;i++) idx.push(i);
    const cheias = idx.filter(i => rows[i].t.trim());
    g.useful = idx.some(i => !isNoise(rows[i].t, lang));
    g.head = cheias.length ? cheias[0] : g.start;
    g.text = cheias.length ? rows.slice(cheias[0], cheias[cheias.length-1]+1).map(r => r.t).join('\n') : '';
  });
  return groups;
}
function linesHtml(id, rows, opts){
  opts = opts || {};
  const lang = D.files[id].lang, st = {inC:false};
  const folds = opts.noFold ? [] : foldRanges(rows);
  const fkey = id + '|' + (opts.key||'');
  const fstate = state.folds[fkey] || (state.folds[fkey] = folds.map(f => f.collapsed && !rows.slice(f.start, f.end+1).some(r => r.s)));
  const hidden = new Set(), foldAt = new Map();
  folds.forEach((f,k) => { foldAt.set(f.start, k); if (fstate[k]) for (let i=f.start+1;i<=f.end;i++) hidden.add(i); });
  const gw = String(rows.length).length * 8 + 22;
  const groups = changeGroups(rows, lang), grupoDe = new Map();
  groups.forEach((g,k) => { if (g.useful) for (let i=g.start;i<=g.end;i++) grupoDe.set(i, k); });
  let html = '';
  rows.forEach((row,i) => {
    const code = row.ghost ? '' : hl(row.t, lang, st);
    if (hidden.has(i)) return;
    const s = row.s, hk = grupoDe.get(i);
    let cls = 'ln' + (s ? ' '+s : '') + (row.ghost ? ' ghost' : '');
    let extra = '';
    if (hk != null && groups[hk].head === i){ cls += ' hunkhead'; extra = '<button class="hcopy" data-hunk="'+hk+'">Copiar bloco</button>'; }
    const k = foldAt.get(i);
    const fd = k != null ? '<span class="fd can" data-fold="'+k+'" title="Recolher/expandir">'+(fstate[k]?'⊞':'⊟')+'</span>' : '<span class="fd"></span>';
    let tx = code;
    if (k != null && fstate[k]){
      const ind = (/^\s*/.exec(row.t)||[''])[0];
      tx = esc(ind) + '<span class="foldbox" data-fold="'+k+'">'+esc(folds[k].desc)+'</span>';
    }
    const del = row.delBefore ? '<span class="delmark" data-del="'+i+'" title="Linhas removidas aqui"></span>' : '';
    html += '<div class="'+cls+'" data-i="'+i+'"'+(hk!=null?' data-h="'+hk+'"':'')+'><span class="no">'+(row.ghost?'':(row.no||i+1))+'</span>'+fd+'<span class="bar"'+(s==='m'?' data-old="'+i+'"':'')+'></span><span class="tx">'+(tx||' ')+'</span>'+del+extra+'</div>';
  });
  return {html, gw, groups};
}
function renderEditor(){
  const W = $('#codewrap'), T = $('#etool');
  if (!state.cur){
    T.innerHTML = '';
    W.innerHTML = '<div class="empty"><div><h2>Abra um arquivo</h2><p>Clique num arquivo da árvore à esquerda ou siga o <b>Roteiro</b>.<br>Arquivos <span style="color:var(--addText);font-weight:600">verdes</span> são novos; <span style="color:var(--modText);font-weight:600">âmbar</span> foram alterados.</p></div></div>';
    return;
  }
  const id = state.cur, f = D.files[id];
  const st = fileStatus(state.ver, id);
  const {rows, removedTail} = buildRows(id, state.ver);
  const r = linesHtml(id, rows, {key: state.ver});
  const nA = rows.filter(x => x.s==='a').length, nM = rows.filter(x => x.s==='m').length, nD = rows.reduce((s,x)=>s+(x.delBefore?x.delBefore.length:0),0) + (removedTail?removedTail.length:0);
  T.innerHTML =
    '<div class="seg"><button class="on">Source</button><button disabled title="Só no NetBeans">'+(f.form?'Design':'History')+'</button></div>' +
    '<span class="crumb" title="'+esc(f.full)+'">'+esc(f.full)+'</span>' +
    (st==='igual' ? '<span class="chg">sem alterações</span>' : '<span class="chg">'+(nA?'<b style="color:var(--addText)">+'+nA+'</b> ':'')+(nM?'<b style="color:var(--modText)">~'+nM+'</b> ':'')+(nD?'<b style="color:var(--delText)">−'+nD+'</b>':'')+'</span>') +
    '<button class="btn" id="prevH" title="Mudança anterior (Alt+↑)">'+IC.up+'</button><button class="btn" id="nextH" title="Próxima mudança (Alt+↓)">'+IC.down+'</button>' +
    ((f.snips && f.snips[state.ver]) || []).map((s,k) => '<button class="btn primary" data-snip="'+k+'">'+IC.copy+esc(s.label)+'</button>').join('') +
    '<button class="btn'+(f.snips && f.snips[state.ver] ? '' : ' primary')+'" id="copyAll">'+IC.copy+(st==='novo'?'Copiar arquivo':'Copiar arquivo inteiro')+'</button>';
  T.querySelectorAll('[data-snip]').forEach(b => b.onclick = () => { const s = f.snips[state.ver][+b.dataset.snip]; copy(s.text, s.label.replace(/^Copiar /,'') + ' copiado', b); });
  W.innerHTML = '<div class="code" id="code" style="--gw:'+r.gw+'px"><div class="inner">'+r.html+(removedTail?'<div class="ln r"><span class="no"></span><span class="fd"></span><span class="bar"></span><span class="tx">'+esc('[removido no fim] '+removedTail.join(' ⏎ '))+'</span></div>':'')+'</div></div><div class="ruler" id="ruler" title="Mapa de mudanças"></div>';
  const uteis = r.groups.filter(g => g.useful);
  hunks = (uteis.length ? uteis : r.groups).map(g => g.head); hunkIdx = -1;
  wireCode($('#code'), rows, id, r.groups);
  drawRuler(rows);
  $('#copyAll').onclick = e => copy(f.text[state.ver], 'Arquivo copiado', e.currentTarget);
  $('#prevH').onclick = () => jumpHunk(-1);
  $('#nextH').onclick = () => jumpHunk(1);
  const first = $('#code .ln.a, #code .ln.m');
  if (first && st !== 'novo'){ const c = $('#code'); c.scrollTop = Math.max(0, first.offsetTop - 60); }
}
function wireCode(code, rows, id, groups){
  code.addEventListener('click', e => {
    const fb = e.target.closest('[data-fold]');
    if (fb){
      const key = id + '|' + (code.dataset.key || state.ver);
      const k = +fb.dataset.fold; state.folds[key][k] = !state.folds[key][k];
      const top = code.scrollTop; renderEditor(); $('#code') && ($('#code').scrollTop = top); return;
    }
    const hc = e.target.closest('.hcopy');
    if (hc){ copy(groups[+hc.dataset.hunk].text, 'Bloco copiado', hc); return; }
    const ob = e.target.closest('[data-old]');
    if (ob){ const i = +ob.dataset.old; showPop(ob, 'Linha original (projeto cru)', rows[i].old); return; }
    const dm = e.target.closest('[data-del]');
    if (dm){ const i = +dm.dataset.del; showPop(dm, 'Linhas removidas aqui', rows[i].delBefore.join('\n')); return; }
    const ln = e.target.closest('.ln');
    if (ln){ code.querySelectorAll('.ln.cur').forEach(x => x.classList.remove('cur')); ln.classList.add('cur'); const i = +ln.dataset.i; $('#pos').textContent = (i+1)+':1'; }
  });
  code.addEventListener('mouseover', e => {
    const ln = e.target.closest('.ln[data-h]');
    code.querySelectorAll('.hov').forEach(x => x.classList.remove('hov'));
    if (!ln) return;
    const h = code.querySelector('.ln.hunkhead[data-h="'+ln.dataset.h+'"]');
    if (h){ h.classList.add('hov'); const b = h.querySelector('.hcopy'); if (b){ b.style.right = 'auto'; b.style.left = Math.max(80, code.scrollLeft + code.clientWidth - b.offsetWidth - 14) + 'px'; } }
  });
  code.addEventListener('mouseleave', () => code.querySelectorAll('.hov').forEach(x => x.classList.remove('hov')));
}
function drawRuler(rows){
  const R = $('#ruler'); if (!R) return; const n = rows.length || 1; let h = '';
  let i = 0;
  while (i < rows.length){
    const s = rows[i].s;
    if (!s && !rows[i].delBefore){ i++; continue; }
    if (!s && rows[i].delBefore){ h += '<i class="d" style="top:'+(i/n*100)+'%;height:3px" data-go="'+i+'"></i>'; i++; continue; }
    let j = i; while (j < rows.length && rows[j].s === s) j++;
    h += '<i class="'+(s==='m'?'m':s==='r'?'d':'a')+'" style="top:'+(i/n*100)+'%;height:'+Math.max(3,(j-i)/n*100)+'%" data-go="'+i+'"></i>';
    i = j;
  }
  R.innerHTML = h;
  R.onclick = e => {
    const g = e.target.closest('[data-go]'); const c = $('#code');
    if (g){ const el = c.querySelector('.ln[data-i="'+g.dataset.go+'"]'); if (el) c.scrollTop = el.offsetTop - 60; }
    else { const rr = R.getBoundingClientRect(); c.scrollTop = (e.clientY - rr.top) / rr.height * c.scrollHeight - c.clientHeight/2; }
  };
}
function jumpHunk(d){
  const c = $('#code'); if (!c || !hunks.length) return;
  hunkIdx = (hunkIdx + d + hunks.length) % hunks.length;
  const el = c.querySelector('.ln[data-i="'+hunks[hunkIdx]+'"]');
  if (el){ c.scrollTop = el.offsetTop - 60; c.querySelectorAll('.ln.cur').forEach(x => x.classList.remove('cur')); el.classList.add('cur'); }
}

/* ---------------- painel inferior ---------------- */
function btabs(){
  const t = [{k:'instr', n: state.cur ? 'Instruções — '+D.files[state.cur].name : 'Instruções'}, {k:'out', n:'Output'}, {k:'tests', n:'Testes'}, {k:'help', n:'Problemas comuns'}];
  return t;
}
function renderBottom(){
  $('#btabs').innerHTML = btabs().map(t => '<button class="ptab'+(state.btab===t.k?' on':'')+'" data-k="'+t.k+'" role="tab">'+esc(t.n)+'</button>').join('') + '<span class="grow"></span>';
  const B = $('#bbody');
  if (state.btab === 'instr') B.innerHTML = '<div class="doc">'+instrHtml()+'</div>';
  else if (state.btab === 'out') B.innerHTML = outHtml();
  else if (state.btab === 'tests') B.innerHTML = '<div class="doc">'+D.testsHtml[state.ver]+'</div>';
  else B.innerHTML = '<div class="doc">'+D.helpHtml[state.ver]+'</div>';
  B.scrollTop = 0;
}
$('#btabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b){ state.btab = b.dataset.k; renderBottom(); } });
$('#bbody').addEventListener('click', e => {
  const l = e.target.closest('[data-open]'); if (l){ openFile(l.dataset.open); return; }
  const o = e.target.closest('[data-out]'); if (o){ state.out = +o.dataset.out; renderBottom(); return; }
  const st = e.target.closest('[data-step]'); if (st){ const i = +st.dataset.step; const s = steps()[i]; state.step = i; if (s.file) openFile(s.file, true); else { state.btab = s.tab||'instr'; if (s.out!=null) state.out = s.out; renderBottom(); } renderSteps(); }
});
function instrHtml(){
  const s = state.step != null ? steps()[state.step] : null;
  if (s && !s.file && s.html) return s.html;
  if (!state.cur) return V().intro;
  const f = D.files[state.cur], st = fileStatus(state.ver, state.cur);
  const ins = (f.instr && f.instr[state.ver]) || '';
  const head = '<h3>'+(st==='novo'?'<span class="tag novo">NOVO</span>':st==='alterado'?'<span class="tag alterado">ALTERAR</span>':'<span class="tag" style="border:1px solid var(--line2)">SEM ALTERAÇÃO</span>')+esc(f.name)+' <span style="font-weight:400;color:var(--muted);font-size:12px">· '+f.proj+'</span></h3><span class="path">'+esc(f.full)+'</span>';
  return head + (ins || (st==='igual' ? '<p>Este arquivo continua igual ao projeto da aula. Não precisa mexer.</p>' : ''));
}
function outHtml(){
  const outs = V().outputs;
  if (state.out >= outs.length) state.out = 0;
  const o = outs[state.out];
  const body = o.lines.map(l => {
    if (l.startsWith('# ')) return '<span class="cmt">'+esc(l.slice(2))+'</span>';
    let c = /NOT_FOUND|UNAVAILABLE|Exception|não/i.test(l) ? 'err' : /no ar|iniciad|registrad|Registrad|Localizad|sucesso|senha [NP]-|Senha [NP]-/.test(l) ? 'ok' : /Removid|ENTER|Encerrando/.test(l) ? 'info' : '';
    return c ? '<span class="'+c+'">'+esc(l)+'</span>' : esc(l);
  }).join('\n');
  return '<div class="outtabs">'+outs.map((x,i) => '<button class="'+(i===state.out?'on':'')+'" data-out="'+i+'">'+esc(x.tab)+'</button>').join('')+'</div><pre class="console">'+body+'</pre>';
}

/* ---------------- status bar ---------------- */
function renderStatus(){
  let nN = 0, nA = 0;
  Object.keys(D.files).forEach(id => { const s = statusOf(id); if (s==='novo') nN++; else if (s==='alterado') nA++; });
  $('#status').innerHTML = '<span><b style="color:var(--addText)">'+nN+' novos</b> · <b style="color:var(--modText)">'+nA+' alterados</b></span><span class="grow"></span><span id="pos">1:1</span><span>INS</span><span>UTF-8</span>';
  $('#wintitle').textContent = (state.cur ? D.files[state.cur].name + ' — ' : '') + 'Central de Senhas · Serviço de Nomes';
}

/* ---------------- util ---------------- */
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1400); }
function copy(text, msg, btn){
  const ok = () => { toast(msg); marcar(btn, true); };
  const falhou = () => { toast('Não deu para copiar: selecione o código e use Ctrl+C'); marcar(btn, false); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  function fallback(){
    const a = document.createElement('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); let deu = false;
    try { deu = document.execCommand('copy'); } catch(e){}
    a.remove(); deu ? ok() : falhou();
  }
}
/* O botão clicado vira "✓ Copiado!" por um instante e depois volta ao normal */
function marcar(btn, deu){
  if (!btn) return;
  clearTimeout(btn._t);
  if (btn._orig == null){ btn._orig = btn.innerHTML; btn.style.minWidth = btn.offsetWidth + 'px'; }
  btn.classList.remove('copied', 'copyfail'); void btn.offsetWidth;  // reinicia a animação em cliques seguidos
  btn.classList.add(deu ? 'copied' : 'copyfail');
  btn.innerHTML = deu ? IC.check + 'Copiado!' : IC.fail + 'Não copiou';
  btn._t = setTimeout(() => { btn.innerHTML = btn._orig; btn._orig = null; btn.classList.remove('copied', 'copyfail'); btn.style.minWidth = ''; }, 1600);
}
let popEl = null;
function showPop(anchor, title, text){
  closePop();
  popEl = document.createElement('div'); popEl.className = 'pop';
  popEl.innerHTML = '<div class="ph"><span>'+esc(title)+'</span><button aria-label="Fechar">✕</button></div><pre>'+esc(text)+'</pre>';
  document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  popEl.style.left = Math.min(r.left + 10, innerWidth - popEl.offsetWidth - 10) + 'px';
  popEl.style.top = Math.min(r.bottom + 4, innerHeight - popEl.offsetHeight - 10) + 'px';
  popEl.querySelector('button').onclick = closePop;
}
function closePop(){ if (popEl){ popEl.remove(); popEl = null; } }
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-old],[data-del]')) closePop(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePop();
  if (e.altKey && e.key === 'ArrowDown'){ e.preventDefault(); jumpHunk(1); }
  if (e.altKey && e.key === 'ArrowUp'){ e.preventDefault(); jumpHunk(-1); }
});

/* ---------------- toolbar actions ---------------- */
$('#btnBuild').onclick = () => { const i = steps().findIndex(s => /Clean and Build/.test(s.title)); if (i>=0){ state.step = i; state.btab = 'instr'; renderSteps(); renderBottom(); } };
$('#btnRun').onclick = () => { state.btab = 'out'; renderBottom(); };
$('#btnTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); SS('theme', nx);
};
$('#btnTree').onclick = () => $('#left').classList.toggle('open');

/* ---------------- splitters ---------------- */
function drag(el, onMove){
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const mv = ev => onMove(ev); const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
drag($('#vsplit'), e => { const w = Math.min(Math.max(220, e.clientX), innerWidth*0.5); $('#main').style.setProperty('--leftw', w+'px'); });
drag($('#botsplit'), e => { const r = $('#center').getBoundingClientRect(); const h = Math.min(Math.max(80, r.bottom - e.clientY), r.height - 120); $('#center').style.setProperty('--both', h+'px'); });
drag($('#navsplit'), e => { const r = $('#left').getBoundingClientRect(); const h = Math.min(Math.max(80, r.bottom - e.clientY), r.height - 100); $('#left').style.setProperty('--navh', h+'px'); });

/* ---------------- start ---------------- */
const hp = new URLSearchParams(location.hash.slice(1));
const saved = hp.get('f') || LS('cur');
const startFile = (saved && D.files[saved] && visible(saved)) ? saved : (steps().find(s => s.file) || {}).file;
if (startFile){ state.open.push(startFile); state.cur = startFile; const i = steps().findIndex(s => s.file === startFile); state.step = i >= 0 ? i : null; }
renderToolbar(); renderTree(); renderTabs(); renderEditor(); renderSteps(); renderBottom(); renderStatus();
})();
</script>
</body>
</html>

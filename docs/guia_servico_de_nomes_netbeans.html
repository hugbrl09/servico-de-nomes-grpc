<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia Serviço de Nomes</title>
<style>
:root{
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",Menlo,monospace;
  --bg:#f2f2f2;--chrome:#e9e9e9;--chrome2:#f7f7f7;--panel:#ffffff;--line:#c9c9c9;--line2:#dddddd;
  --text:#1e1e1e;--muted:#6b6b6b;--sel:#d5e3f7;--selline:#2675bf;--hover:#e6eef9;
  --editor:#ffffff;--gutter:#f3f3f3;--gutterText:#8f8f8f;--curline:#eef4fd;
  --kw:#0000e6;--str:#ce7b00;--com:#969696;--ann:#808000;--num:#1e1e1e;--type:#1e1e1e;--decl:#000000;
  --addBg:#e2f5e2;--addBar:#3aa53a;--addText:#1d7a1d;
  --modBg:#fff0cc;--modBar:#e0a024;--modText:#9a6400;
  --delBar:#d64545;--delBg:#fbe3e3;--delText:#b22b2b;
  --fold:#f0f0f0;--foldLine:#b5b5b5;
  --out:#ffffff;--outText:#1e1e1e;--outOk:#1d7a1d;--outErr:#c62828;--outInfo:#2a62b8;
  --title:#dcdcdc;--tab:#e4e4e4;--tabActive:#ffffff;--accent:#2675bf;
  --pop:#ffffff;--shadow:0 6px 24px rgba(0,0,0,.18);
  --scroll:rgba(0,0,0,.2);--scrollHover:rgba(0,0,0,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2b2b2b;--chrome:#3c3f41;--chrome2:#45494a;--panel:#2f3133;--line:#1f1f1f;--line2:#4a4d50;
    --text:#d6d6d6;--muted:#9a9a9a;--sel:#2f4b6e;--selline:#4b8fd6;--hover:#3a4553;
    --editor:#232425;--gutter:#2e3032;--gutterText:#777;--curline:#2b3038;
    --kw:#cc7832;--str:#6a8759;--com:#808080;--ann:#bbb529;--num:#6897bb;--type:#d6d6d6;--decl:#ffc66d;
    --addBg:#26402a;--addBar:#4fb34f;--addText:#7fd67f;
    --modBg:#47391a;--modBar:#e0a024;--modText:#f0c060;
    --delBar:#e05555;--delBg:#4a2626;--delText:#f08a8a;
    --fold:#3a3d40;--foldLine:#666;
    --out:#1f2021;--outText:#cfcfcf;--outOk:#7fd67f;--outErr:#ff7b7b;--outInfo:#79aef0;
    --title:#3c3f41;--tab:#3a3d3f;--tabActive:#2b2b2b;--accent:#4b8fd6;
    --pop:#3c3f41;--shadow:0 6px 24px rgba(0,0,0,.5);
    --scroll:rgba(255,255,255,.18);--scrollHover:rgba(255,255,255,.34);
  }
}
:root[data-theme="dark"]{
  --bg:#2b2b2b;--chrome:#3c3f41;--chrome2:#45494a;--panel:#2f3133;--line:#1f1f1f;--line2:#4a4d50;
  --text:#d6d6d6;--muted:#9a9a9a;--sel:#2f4b6e;--selline:#4b8fd6;--hover:#3a4553;
  --editor:#232425;--gutter:#2e3032;--gutterText:#777;--curline:#2b3038;
  --kw:#cc7832;--str:#6a8759;--com:#808080;--ann:#bbb529;--num:#6897bb;--type:#d6d6d6;--decl:#ffc66d;
  --addBg:#26402a;--addBar:#4fb34f;--addText:#7fd67f;
  --modBg:#47391a;--modBar:#e0a024;--modText:#f0c060;
  --delBar:#e05555;--delBg:#4a2626;--delText:#f08a8a;
  --fold:#3a3d40;--foldLine:#666;
  --out:#1f2021;--outText:#cfcfcf;--outOk:#7fd67f;--outErr:#ff7b7b;--outInfo:#79aef0;
  --title:#3c3f41;--tab:#3a3d3f;--tabActive:#2b2b2b;--accent:#4b8fd6;
  --pop:#3c3f41;--shadow:0 6px 24px rgba(0,0,0,.5);
  --scroll:rgba(255,255,255,.18);--scrollHover:rgba(255,255,255,.34);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--ui);overflow:hidden}
button{font:inherit;color:inherit}

/* barras de rolagem finas e arredondadas, no estilo do FlatLaf do NetBeans */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);background-clip:padding-box;border:3px solid transparent;border-radius:8px;min-height:32px;min-width:32px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollHover);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-button{display:none}
/* na barra de abas ela fica bem fina e só aparece com o mouse em cima */
.etabs::-webkit-scrollbar{height:4px}
.etabs::-webkit-scrollbar-thumb{background:transparent;border:0;border-radius:2px;min-width:40px}
.etabs:hover::-webkit-scrollbar-thumb{background:var(--scroll)}
.etabs::-webkit-scrollbar-thumb:hover{background:var(--scrollHover)}
/* Firefox não tem ::-webkit-scrollbar: usa a versão fina padrão com as mesmas cores */
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
}
.ide{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100vh;height:100dvh}

/* title + menu */
.titlebar{display:flex;align-items:center;gap:10px;background:var(--title);padding:5px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.titlebar .logo{width:16px;height:16px;flex:none}
.titlebar .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .win{display:flex;gap:16px;color:var(--muted);font-size:12px;user-select:none}
.menubar{display:flex;gap:2px;background:var(--chrome2);border-bottom:1px solid var(--line2);padding:1px 6px;overflow:hidden;white-space:nowrap}
.menubar span{padding:3px 8px;border-radius:3px;color:var(--text);cursor:default}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:4px;background:var(--chrome2);border-bottom:1px solid var(--line);padding:4px 8px;flex-wrap:wrap}
.tb{display:inline-grid;place-items:center;width:28px;height:26px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;padding:0}
.tb:hover{background:var(--hover);border-color:var(--line2)}
.tb svg{width:18px;height:18px}
.tb[disabled]{opacity:.45;cursor:default}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* main split */
.main{display:grid;grid-template-columns:var(--leftw,clamp(300px,31vw,360px)) 4px minmax(0,1fr);min-height:0}
.left{display:grid;grid-template-rows:1fr 4px var(--navh,42%);grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.splitter{background:var(--chrome);cursor:col-resize}
.hsplit{background:var(--chrome);cursor:row-resize}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0}
.ptabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--line);min-height:27px;overflow:hidden}
.ptab{padding:4px 12px;border:none;border-right:1px solid var(--line2);background:var(--tab);cursor:pointer;white-space:nowrap;font-size:12.5px}
.ptab.on{background:var(--panel);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.ptabs .grow{flex:1}
.pbody{flex:1;overflow:auto;min-height:0}

/* tree */
.tree{list-style:none;margin:0;padding:4px 0 10px}
.tree ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;gap:4px;padding:1px 6px 1px calc(6px + var(--d,0) * 16px);cursor:pointer;white-space:nowrap;user-select:none;min-height:21px}
.node:hover{background:var(--hover)}
.node.sel{background:var(--sel)}
.node .tw{width:12px;flex:none;color:var(--muted);font-size:9px;text-align:center}
.node svg{width:16px;height:16px;flex:none}
.node .nm{overflow:hidden;text-overflow:ellipsis}
.node.novo .nm{color:var(--addText);font-weight:600}
.node.alterado .nm{color:var(--modText);font-weight:600}
.node .badge{font:700 9.5px/1 var(--ui);padding:2px 4px;border-radius:3px;margin-left:4px;letter-spacing:.3px}
.badge.novo{background:var(--addBg);color:var(--addText);border:1px solid var(--addBar)}
.badge.alterado{background:var(--modBg);color:var(--modText);border:1px solid var(--modBar)}
.node .dot{width:6px;height:6px;border-radius:50%;background:var(--modBar);margin-left:2px;flex:none}
.node.dim{color:var(--muted);cursor:default}
.node.dim:hover{background:none}
.node .hint{color:var(--muted);font-size:11px;margin-left:6px}
.collapsed > ul{display:none}

/* navigator / roteiro */
.steps{list-style:none;margin:0;padding:6px 6px 14px}
.step{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 6px;border-radius:4px;cursor:pointer;align-items:start}
.step:hover{background:var(--hover)}
.step.sel{background:var(--sel)}
.step .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chrome);font-weight:700;font-size:11px;border:1px solid var(--line2)}
.step .t{font-weight:600;line-height:1.3}
.step .s{color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:1px}
.step .tag{font:700 9.5px/1 var(--ui);padding:2px 4px;border-radius:3px;margin-right:4px;vertical-align:1px}
.tag.novo{background:var(--addBg);color:var(--addText);border:1px solid var(--addBar)}
.tag.alterado{background:var(--modBg);color:var(--modText);border:1px solid var(--modBar)}
.tag.run{background:var(--sel);color:var(--text);border:1px solid var(--selline)}

/* center */
.center{display:grid;grid-template-rows:1fr 4px var(--both,34%);grid-template-columns:minmax(0,1fr);min-width:0;min-height:0}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--editor)}
.etabs{display:flex;position:relative;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;min-width:0;min-height:28px;flex:none}
.etab{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;border:none;border-right:1px solid var(--line2);background:var(--tab);cursor:pointer;white-space:nowrap;font-size:12.5px}
.etab.on{background:var(--tabActive);box-shadow:inset 0 2px 0 var(--accent)}
.etab.novo .lbl{color:var(--addText);font-weight:600}
.etab.alterado .lbl{color:var(--modText);font-weight:600}
.etab .x{border:none;background:none;width:16px;height:16px;border-radius:3px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0;font-size:13px;line-height:1}
.etab .x:hover{background:var(--hover);color:var(--text)}
.etab svg{width:14px;height:14px}
.etool{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--line2);background:var(--chrome2);flex-wrap:wrap;min-height:30px}
.etool .seg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.etool .seg button{border:none;background:var(--panel);padding:2px 10px;cursor:pointer;font-size:12px}
.etool .seg button.on{background:var(--sel);font-weight:600}
.etool .seg button[disabled]{color:var(--muted);cursor:default}
.crumb{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:14px;height:14px}
.btn.primary{border-color:var(--selline)}
/* feedback de cópia no próprio botão */
.btn.copied,.hcopy.copied{background:var(--addBg);border-color:var(--addBar);color:var(--addText);font-weight:600}
.btn.copyfail,.hcopy.copyfail{background:var(--delBg);border-color:var(--delBar);color:var(--delText);font-weight:600}
.copied,.copyfail{animation:copiado .28s ease-out}
@keyframes copiado{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.copied,.copyfail{animation:none}}
.chg{font-size:12px;color:var(--muted);white-space:nowrap}

.codewrap{position:relative;flex:1;min-height:0;display:flex}
.code{flex:1;overflow:auto;font:13px/19px var(--mono);tab-size:4;min-width:0;position:relative}
.ruler{width:12px;flex:none;border-left:1px solid var(--line2);background:var(--gutter);position:relative;cursor:pointer}
.ruler i{position:absolute;left:2px;right:2px;min-height:3px;border-radius:1px}
.ruler i.a{background:var(--addBar)}.ruler i.m{background:var(--modBar)}.ruler i.d{background:var(--delBar)}
.inner{width:max-content;min-width:100%;padding-bottom:28px}
.ln{display:grid;grid-template-columns:var(--gw,52px) 14px 6px 1fr;position:relative}
.ln .no{background:var(--gutter);color:var(--gutterText);text-align:right;padding-right:6px;user-select:none;position:sticky;left:0;z-index:2}
.ln .fd{background:var(--gutter);color:var(--muted);user-select:none;text-align:center;cursor:default;font-size:10px;position:sticky;left:var(--gw,52px);z-index:2}
.ln .fd.can{cursor:pointer}
.ln .fd.can:hover{color:var(--text)}
.ln .bar{background:var(--gutter);position:sticky;left:calc(var(--gw,52px) + 14px);z-index:2}
.ln .tx{white-space:pre;padding:0 24px 0 8px}
.ln.a .tx{background:var(--addBg)}
.ln.a .bar{background:var(--addBar)}
.ln.m .tx{background:var(--modBg)}
.ln.m .bar{background:var(--modBar);cursor:pointer}
.ln.cur .tx{box-shadow:inset 0 0 0 1px var(--selline)}
.ln.ghost .tx{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 7px);opacity:.55}
.ln.r .tx{background:var(--delBg);color:var(--delText)}
.ln.r .bar{background:var(--delBar)}
.delmark{position:absolute;left:calc(var(--gw,52px) + 13px);top:-5px;width:0;height:0;border-left:7px solid var(--delBar);border-top:5px solid transparent;border-bottom:5px solid transparent;z-index:3;cursor:pointer}
.foldbox{display:inline-block;border:1px solid var(--foldLine);background:var(--fold);border-radius:3px;padding:0 6px;color:var(--muted);cursor:pointer;line-height:16px}
.foldbox:hover{color:var(--text)}
.hcopy{position:absolute;right:10px;top:1px;z-index:4;display:none;border:1px solid var(--line2);background:var(--panel);border-radius:4px;font:600 11px/1 var(--ui);padding:3px 7px;cursor:pointer;box-shadow:var(--shadow)}
.ln.hunkhead.hov .hcopy,.ln.hunkhead .hcopy:focus,.ln.hunkhead .hcopy.copied,.ln.hunkhead .hcopy.copyfail{display:block}
.hcopy svg{width:11px;height:11px;vertical-align:-1px;margin-right:4px}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.an{color:var(--ann)}.nu{color:var(--num)}.dc{color:var(--decl);font-weight:700}.xt{color:var(--kw)}.xa{color:var(--ann)}

/* empty */
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
.empty h2{color:var(--text);margin:0 0 6px;font-size:18px}

/* bottom */
.bottom{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-top:1px solid var(--line)}
.bbody{flex:1;overflow:auto;min-height:0}
.doc{padding:12px 16px 24px;max-width:980px}
.doc h3{margin:2px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc h4{margin:14px 0 6px;font-size:13px}
.doc p{margin:6px 0}
.doc ul,.doc ol{margin:6px 0;padding-left:22px}
.doc li{margin:3px 0}
.doc code{font:12px var(--mono);background:var(--chrome2);border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.doc .path{display:block;font:12px var(--mono);background:var(--chrome2);border:1px solid var(--line2);border-radius:4px;padding:5px 8px;margin:6px 0;overflow-wrap:anywhere}
.note{border:1px solid var(--line2);border-radius:5px;padding:8px 10px;margin:8px 0;background:var(--chrome2)}
.note.warn{border-color:var(--modBar);background:var(--modBg)}
.note.ok{border-color:var(--addBar);background:var(--addBg)}
.note.bad{border-color:var(--delBar);background:var(--delBg)}
.flink{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tests{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
.tests th,.tests td{border:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
.tests th{background:var(--chrome2)}
.tests td.st{white-space:nowrap;font-weight:700}
.st.yes{color:var(--addText)}.st.part{color:var(--modText)}.st.no{color:var(--delText)}
.outtabs{display:flex;gap:0;border-bottom:1px solid var(--line2);background:var(--chrome2);overflow-x:auto}
.outtabs button{border:none;border-right:1px solid var(--line2);background:none;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.outtabs button.on{background:var(--out);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.outbody{display:flex;gap:0;min-height:0}
.outside{display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid var(--line2);background:var(--chrome2)}
.console{flex:1;margin:0;padding:8px 12px;font:12.5px/1.5 var(--mono);background:var(--out);color:var(--outText);white-space:pre-wrap;min-height:120px}
.console .ok{color:var(--outOk)}.console .err{color:var(--outErr)}.console .info{color:var(--outInfo)}.console .dim{color:var(--muted)}
.console .cmt{color:var(--muted);font-style:italic}

/* status bar */
.statusbar{display:flex;gap:14px;align-items:center;background:var(--chrome);border-top:1px solid var(--line);padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.statusbar .grow{flex:1}
.statusbar b{color:var(--text);font-weight:600}

/* popup + toast */
.pop{position:fixed;z-index:50;background:var(--pop);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);max-width:min(620px,92vw);font-size:12px}
.pop .ph{padding:6px 10px;border-bottom:1px solid var(--line2);font-weight:600;display:flex;justify-content:space-between;gap:12px}
.pop pre{margin:0;padding:8px 10px;font:12.5px/1.5 var(--mono);white-space:pre;overflow:auto;max-height:260px}
.pop .ph button{border:none;background:none;cursor:pointer;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:var(--pop);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:6px;padding:7px 14px;z-index:60;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.mobtoggle{display:none}
@media (max-width:860px){
  body{overflow:auto}
  .ide{height:auto;min-height:100vh;grid-template-rows:auto auto auto auto auto}
  .menubar{display:none}
  .titlebar .win{display:none}
  .legend{margin-left:0;width:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .splitter,.hsplit{display:none}
  .left{display:none;grid-template-rows:auto auto;border-right:none;border-bottom:1px solid var(--line)}
  .left.open{display:grid}
  .left .pbody{max-height:46vh}
  .mobtoggle{display:inline-flex}
  .center{grid-template-rows:auto auto}
  .editor{height:62vh}
  .bottom{min-height:40vh}
}
</style>
</head>
<body>
<div class="ide" id="ide">
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="3" fill="#2675bf"/><path d="M4.5 11V5l7 6V5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
    <span class="ttl" id="wintitle">Central de Senhas · Serviço de Nomes — Grupo 5</span>
    <span class="win" aria-hidden="true"><span>—</span><span>☐</span><span>✕</span></span>
  </div>
  <div class="menubar" aria-hidden="true"><span>File</span><span>Edit</span><span>View</span><span>Navigate</span><span>Source</span><span>Refactor</span><span>Run</span><span>Debug</span><span>Profile</span><span>Team</span><span>Tools</span><span>Window</span><span>Help</span></div>
  <div class="toolbar">

},"instr":{"enunciado":"\n\u003cp>\u003cb>O que fazer:\u003c/b> abra o arquivo (aba \u003cb>Projects\u003c/b> › Other Sources › src/main/proto) e \u003cb>acrescente\u003c/b> os dois blocos verdes: o \u003ccode>service ServicoNomes\u003c/code> logo depois do \u003ccode>AtendimentoService\u003c/code>, e as mensagens no fim. Use \u003cb>Copiar bloco\u003c/b> (aparece ao passar o mouse sobre o bloco verde) ou \u003cb>Copiar arquivo inteiro\u003c/b>.\u003c/p>\n\u003ch4>O que explicar\u003c/h4>\u003cul>\n\u003cli>São os 3 RPCs pedidos no Trabalho 5: \u003ccode>Registrar\u003c/code> (a Central entra ao subir), \u003ccode>Localizar\u003c/code> (o totem pergunta antes de conectar) e \u003ccode>Remover\u003c/code> (a Central sai ao encerrar).\u003c/li>\n\u003cli>\u003ccode>Endereco\u003c/code> é o que volta: host e porta. \u003ccode>Vazio\u003c/code> é uma resposta sem campos.\u003c/li>\n\u003cli>Não mexemos nos números dos campos que já existiam: as mensagens antigas continuam iguais.\u003c/li>\u003c/ul>\n\u003cdiv class=\"note warn\">O \u003ccode>.proto\u003c/code> precisa ficar \u003cb>idêntico\u003c/b> nos dois projetos. Não edite nada dentro de \u003ccode>target\u003c/code>.\u003c/div>"}},"s_impl":{"name":"AtendimentoServiceImpl.java","full":"ServidorAtendimentoRPC/src/main/java/com/mycompany/servidoratendimentorpc/AtendimentoServiceImpl.java","path":"src/main/java/com/mycompany/servidoratendimentorpc/AtendimentoServiceImpl.java","proj":"ServidorAtendimentoRPC","projShort":"servidor","lang":"java","form":false,"text":{"orig":"package com.mycompany.servidoratendimentorpc;\n\nimport com.mycompany.atendimentorpc.AtendimentoServiceGrpc;\nimport com.mycompany.atendimentorpc.PedidoSenha;\nimport com.mycompany.atendimentorpc.Senha;\nimport com.mycompany.atendimentorpc.TipoAtendimento;\nimport io.grpc.stub.StreamObserver;\n\npublic class AtendimentoServiceImpl\n        extends AtendimentoServiceGrpc.AtendimentoServiceImplBase {\n\n    // Estado compartilhado: todos os totens usam o mesmo contador\n    private int proximoNumero = 1;\n\n    // synchronized: dois totens nunca recebem o mesmo número\n    private synchronized int gerarNumero() {\n        return proximoNumero++;\n    }\n\n    @Override\n    public void pegarSenha(PedidoSenha req, StreamObserver\u003cSenha> observador) {\n        int numero = gerarNumero();\n        String prefixo = req.getTipo() == TipoAtendimento.PRIORITARIO\n                ? \"P\" : \"N\";\n        String codigo = String.format(\"%s-%03d\", prefixo, numero);\n        String mensagem = req.getNome() + \", sua senha é \" + codigo\n                + \" (totem: \" + req.getLocal() + \")\";\n        System.out.println(\"Senha \" + codigo + \" para \" + req.getNome()\n                + \" no totem \" + req.getLocal());\n        Senha resposta = Senha.newBuilder()\n                .setNumero(numero)\n                .setCodigo(codigo)\n                .setMensagem(mensagem)\n                .build();\n        observador.onNext(resposta); // envia a resposta ao totem\n        observador.onCompleted();    // encerra a chamada\n    }\n}\n","enunciado":"package com.mycompany.servidoratendimentorpc;\n\nimport com.mycompany.atendimentorpc.AtendimentoServiceGrpc;\nimport com.mycompany.atendimentorpc.PedidoSenha;\nimport com.mycompany.atendimentorpc.Senha;\nimport com.mycompany.atendimentorpc.TipoAtendimento;\nimport io.grpc.stub.StreamObserver;\n\npublic class AtendimentoServiceImpl\n        extends AtendimentoServiceGrpc.AtendimentoServiceImplBase {\n\n    // Estado compartilhado: todos os totens usam o mesmo contador\n    private int proximoNumero = 1;\n\n    // synchronized: dois totens nunca recebem o mesmo número\n    private synchronized int gerarNumero() {\n        return proximoNumero++;\n    }\n\n    @Override\n    public void pegarSenha(PedidoSenha req, StreamObserver\u003cSenha> observador) {\n        int numero = gerarNumero();\n        String prefixo = req.getTipo() == TipoAtendimento.PRIORITARIO\n                ? \"P\" : \"N\";\n        String codigo = String.format(\"%s-%03d\", prefixo, numero);\n        String mensagem = req.getNome() + \", sua senha é \" + codigo\n                + \" (totem: \" + req.getLocal() + \")\";\n        System.out.println(\"Senha \" + codigo + \" para \" + req.getNome()\n                + \" no totem \" + req.getLocal());\n        Senha resposta = Senha.newBuilder()\n                .setNumero(numero)\n                .setCodigo(codigo)\n                .setMensagem(mensagem)\n                .build();\n        observador.onNext(resposta); // envia a resposta ao totem\n        observador.onCompleted();    // encerra a chamada\n    }\n}\n"},"instr":{}},"s_nomes":{"name":"ServicoNomesImpl.java","full":"ServidorAtendimentoRPC/src/main/java/com/mycompany/servidoratendimentorpc/ServicoNomesImpl.java","path":"src/main/java/com/mycompany/servidoratendimentorpc/ServicoNomesImpl.java","proj":"ServidorAtendimentoRPC","projShort":"servidor","lang":"java","form":false,"text":{"orig":null,"enunciado":"package com.mycompany.servidoratendimentorpc;\n\nimport com.mycompany.atendimentorpc.Endereco;\nimport com.mycompany.atendimentorpc.Nome;\nimport com.mycompany.atendimentorpc.Registro;\nimport com.mycompany.atendimentorpc.ServicoNomesGrpc;\nimport com.mycompany.atendimentorpc.Vazio;\nimport io.grpc.Status;\nimport io.grpc.stub.StreamObserver;\nimport java.util.Map;\nimport java.util.concurrent.ConcurrentHashMap;\n\npublic class ServicoNomesImpl\n        extends ServicoNomesGrpc.ServicoNomesImplBase {\n\n    // O registro: nome -> endereço, compartilhado por todas as chamadas\n    // ConcurrentHashMap: várias chamadas podem mexer no mapa ao mesmo tempo\n    private final Map\u003cString, Endereco> registro = new ConcurrentHashMap\u003c>();\n\n    @Override\n    public void registrar(Registro req, StreamObserver\u003cVazio> observador) {\n        Endereco endereco = Endereco.newBuilder()\n                .setHost(req.getHost())\n                .setPorta(req.getPorta())\n                .build();\n        registro.put(req.getNome(), endereco);\n        System.out.println(\"Registrado: \" + req.getNome() + \" -> \"\n                + req.getHost() + \":\" + req.getPorta());\n        observador.onNext(Vazio.getDefaultInstance());\n        observador.onCompleted();\n    }\n\n    @Override\n    public void localizar(Nome req, StreamObserver\u003cEndereco> observador) {\n        Endereco endereco = registro.get(req.getNome());\n        if (endereco == null) {\n            // Ninguém registrou esse nome: a chamada termina com NOT_FOUND\n            System.out.println(\"Localizar \" + req.getNome() + \": NOT_FOUND\");\n            observador.onError(Status.NOT_FOUND\n                    .withDescription(\"Serviço não registrado: \" + req.getNome())\n                    .asRuntimeException());\n            return;\n        }\n        System.out.println(\"Localizado: \" + req.getNome() + \" -> \"\n                + endereco.getHost() + \":\" + endereco.getPorta());\n        observador.onNext(endereco);  // devolve host e porta ao totem\n        observador.onCompleted();\n    }\n\n    @Override\n    public void remover(Nome req, StreamObserver\u003cVazio> observador) {\n        registro.remove(req.getNome());\n        System.out.println(\"Removido: \" + req.getNome());\n        observador.onNext(Vazio.getDefaultInstance());\n        observador.onCompleted();\n    }\n}\n"},"instr":{"enunciado":"\u003cp>\u003cb>Como criar:\u003c/b> botão direito no pacote \u003ccode>com.mycompany.servidoratendimentorpc\u003c/code> › \u003cb>New › Java Class…\u003c/b> › digite o nome (sem \u003ccode>.java\u003c/code>) › \u003cb>Finish\u003c/b>. Apague o que o NetBeans gerou e cole o arquivo inteiro (botão \u003cb>Copiar arquivo\u003c/b>).\u003c/p>\n\u003ch4>O que explicar\u003c/h4>\u003cul>\n\u003cli>\u003ccode>registro\u003c/code>: o mapa nome → \u003ccode>Endereco\u003c/code>. \u003ccode>ConcurrentHashMap\u003c/code> porque várias chamadas chegam ao mesmo tempo, em threads diferentes.\u003c/li>\n\u003cli>\u003ccode>localizar\u003c/code>: se o nome não está no mapa, termina a chamada com \u003ccode>Status.NOT_FOUND\u003c/code> via \u003ccode>onError\u003c/code>. É um código oficial do gRPC, e o totem recebe \u003ccode>StatusRuntimeException\u003c/code> com \u003ccode>NOT_FOUND\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>remover\u003c/code>: tira o nome do mapa. É o que faz \"quem sai, sai do registro\".\u003c/li>\u003c/ul>"}},"s_main":{"name":"ServidorAtendimentoRPC.java","full":"ServidorAtendimentoRPC/src/main/java/com/mycompany/servidoratendimentorpc/ServidorAtendimentoRPC.java","path":"src/main/java/com/mycompany/servidoratendimentorpc/ServidorAtendimentoRPC.java","proj":"ServidorAtendimentoRPC","projShort":"servidor","lang":"java","form":false,"text":{"orig":"package com.mycompany.servidoratendimentorpc;\n\nimport io.grpc.Server;\nimport io.grpc.ServerBuilder;\n\npublic class ServidorAtendimentoRPC {\n\n    public static void main(String[] args) throws Exception {\n        Server servidor = ServerBuilder.forPort(50051)\n                .addService(new AtendimentoServiceImpl())\n                .build()\n                .start();\n        System.out.println(\"Central de Senhas no ar (porta 50051).\");\n        servidor.awaitTermination();\n    }\n}\n","enunciado":"package com.mycompany.servidoratendimentorpc;\n\nimport com.mycompany.atendimentorpc.Nome;\nimport com.mycompany.atendimentorpc.Registro;\nimport com.mycompany.atendimentorpc.ServicoNomesGrpc;\nimport io.grpc.ManagedChannel;\nimport io.grpc.ManagedChannelBuilder;\nimport io.grpc.Server;\nimport io.grpc.ServerBuilder;\nimport java.util.Scanner;\n\npublic class ServidorAtendimentoRPC {\n\n    public static void main(String[] args) throws Exception {\n        Server servidor = ServerBuilder.forPort(50051)\n                .addService(new AtendimentoServiceImpl())\n                .build()\n                .start();\n        System.out.println(\"Central de Senhas no ar (porta 50051).\");\n\n        // Ao subir: a Central se registra no Serviço de Nomes como \"atendimento\"\n        ManagedChannel canalNomes = ManagedChannelBuilder\n                .forAddress(\"localhost\", 50052)\n                .usePlaintext()   // sem TLS: só no laboratório\n                .build();\n        ServicoNomesGrpc.ServicoNomesBlockingStub nomes =\n                ServicoNomesGrpc.newBlockingStub(canalNomes);\n        nomes.registrar(Registro.newBuilder()\n                .setNome(\"atendimento\")\n                .setHost(\"localhost\")\n                .setPorta(50051)\n                .build());\n        System.out.println(\"Registrada como \\\"atendimento\\\" no Serviço de Nomes.\");\n\n        // Ao encerrar: sai do registro, para nenhum totem procurar uma Central desligada\n        System.out.println(\"Pressione ENTER para encerrar a Central.\");\n        new Scanner(System.in).nextLine();\n        nomes.remover(Nome.newBuilder().setNome(\"atendimento\").build());\n        System.out.println(\"Removida do Serviço de Nomes. Encerrando...\");\n        canalNomes.shutdown();\n        servidor.shutdown();\n        servidor.awaitTermination();\n    }\n}\n"},"instr":{"enunciado":"\n\u003cp>\u003cb>O que fazer:\u003c/b> acrescente os imports e os blocos verdes (ou \u003cb>Copiar arquivo inteiro\u003c/b>: este arquivo não tem código gerado, então pode substituir tudo).\u003c/p>\n\u003ch4>O que explicar\u003c/h4>\u003cul>\n\u003cli>\u003cb>Ao subir:\u003c/b> depois de \u003ccode>start()\u003c/code>, a Central chama \u003ccode>registrar\u003c/code> no Serviço de Nomes com o nome \u003ccode>\"atendimento\"\u003c/code> → \u003ccode>localhost:50051\u003c/code>.\u003c/li>\n\u003cli>\u003cb>Ao encerrar:\u003c/b> o \u003ccode>Scanner\u003c/code> espera um ENTER no Output. Aí a Central chama \u003ccode>remover\u003c/code>, fecha o canal e desliga o servidor.\u003c/li>\n\u003cli>Usamos ENTER (e não o botão vermelho de Stop) porque o Stop do NetBeans mata o processo na hora, sem dar chance de sair do registro. Isso vira o teste extra: \"e se cair sem avisar?\".\u003c/li>\u003c/ul>\n\u003cdiv class=\"note warn\">Rode o \u003cspan class=\"flink\" data-open=\"s_srvnom\">ServidorNomes.java\u003c/span> \u003cb>antes\u003c/b>. Sem ele, a Central sobe mas falha ao registrar (\u003ccode>UNAVAILABLE\u003c/code>) e encerra.\u003c/div>"}},"s_srvnom":{"name":"ServidorNomes.java","full":"ServidorAtendimentoRPC/src/main/java/com/mycompany/servidoratendimentorpc/ServidorNomes.java","path":"src/main/java/com/mycompany/servidoratendimentorpc/ServidorNomes.java","proj":"ServidorAtendimentoRPC","projShort":"servidor","lang":"java","form":false,"text":{"orig":null,"enunciado":"package com.mycompany.servidoratendimentorpc;\n\nimport io.grpc.Server;\nimport io.grpc.ServerBuilder;\n\npublic class ServidorNomes {\n\n    // Roda separado da Central: botão direito no arquivo > Run File (Shift+F6)\n    public static void main(String[] args) throws Exception {\n        Server servidor = ServerBuilder.forPort(50052)\n                .addService(new ServicoNomesImpl())\n                .build()\n                .start();\n        System.out.println(\"Serviço de Nomes no ar (porta 50052).\");\n        servidor.awaitTermination();\n    }\n}\n"},"instr":{"enunciado":"\u003cp>\u003cb>Como criar:\u003c/b> botão direito no pacote \u003ccode>com.mycompany.servidoratendimentorpc\u003c/code> › \u003cb>New › Java Class…\u003c/b> › digite o nome (sem \u003ccode>.java\u003c/code>) › \u003cb>Finish\u003c/b>. Apague o que o NetBeans gerou e cole o arquivo inteiro (botão \u003cb>Copiar arquivo\u003c/b>).\u003c/p>\n\u003cp>É o \u003ccode>main\u003c/code> do Serviço de Nomes, igual ao da Central, só que na porta \u003cb>50052\u003c/b>. Roda \u003cb>separado\u003c/b>: botão direito no arquivo › \u003cb>Run File\u003c/b> (Shift+F6).\u003c/p>\n\u003ch4>Por que separado?\u003c/h4>\u003cp>Assim a Central pode cair ou desligar sem levar o registro junto. É o que permite mostrar o teste 3 (sair do registro) e o \"e se a Central cair sem avisar?\".\u003c/p>"}},"s_pom":{"name":"pom.xml","full":"ServidorAtendimentoRPC/pom.xml","path":"pom.xml","proj":"ServidorAtendimentoRPC","projShort":"servidor","lang":"xml","form":false,"text":{"orig":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    \u003cmodelVersion>4.0.0\u003c/modelVersion>\n    \u003cgroupId>com.mycompany\u003c/groupId>\n    \u003cartifactId>ServidorAtendimentoRPC\u003c/artifactId>\n    \u003cversion>1.0-SNAPSHOT\u003c/version>\n    \u003cpackaging>jar\u003c/packaging>\n    \u003cproperties>\n        \u003cproject.build.sourceEncoding>UTF-8\u003c/project.build.sourceEncoding>\n        \u003cmaven.compiler.release>25\u003c/maven.compiler.release>\n        \u003cexec.mainClass>com.mycompany.servidoratendimentorpc.ServidorAtendimentoRPC\u003c/exec.mainClass>\n        \u003cgrpc.version>1.75.0\u003c/grpc.version>\n        \u003cprotobuf.version>3.25.5\u003c/protobuf.version>        \n    \u003c/properties>\n    \u003cname>ServidorAtendimentoRPC\u003c/name>\n    \u003cdependencies>\n    \u003cdependency>\n      \u003cgroupId>io.grpc\u003c/groupId>\n      \u003cartifactId>grpc-netty-shaded\u003c/artifactId>\n      \u003cversion>${grpc.version}\u003c/version>\n    \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-protobuf\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-stub\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u00 sourceEncoding>UTF-8\u003c/project.build.sourceEncoding>\n        \u003cmaven.compiler.release>25\u003c/maven.compiler.release>\n        \u003cexec.mainClass>com.mycompany.servidoratendimentorpc.ServidorAtendimentoRPC\u003c/exec.mainClass>\n        \u003cgrpc.version>1.75.0\u003c/grpc.version>\n        \u003cprotobuf.version>3.25.5\u003c/protobuf.version>        \n    \u003c/properties>\n    \u003cname>ServidorAtendimentoRPC\u003c/name>\n    \u003cdependencies>\n    \u003cdependency>\n      \u003cgroupId>io.grpc\u003c/groupId>\n      \u003cartifactId>grpc-netty-shaded\u003c/artifactId>\n      \u003cversion>${grpc.version}\u003c/version>\n    \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-protobuf\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-stub\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>javax.annotation\u003c/groupId>\n          \u003cartifactId>javax.annotation-api\u003c/artifactId>\n          \u003cversion>1.3.2\u003c/version>\n        \u003c/dependency>\n      \u003c/dependencies>    \n    \u003cbuild>\n      \u003cextensions>\n        \u003cextension>\n          \u003cgroupId>kr.motd.maven\u003c/groupId>\n          \u003cartifactId>os-maven-plugin\u003c/artifactId>\n          \u003cversion>1.7.1\u003c/version>\n        \u003c/extension>\n      \u003c/extensions>\n      \u003cplugins>\n        \u003cplugin>\n          \u003cgroupId>org.xolstice.maven.plugins\u003c/groupId>\n          \u003cartifactId>protobuf-maven-plugin\u003c/artifactId>\n          \u003cversion>0.6.1\u003c/version>\n          \u003cconfiguration>\n            \u003cprotocArtifact>com.google.protobuf:protoc:${protobuf.version}:exe:${os.detected.classifier}\u003c/protocArtifact>\n            \u003cpluginId>grpc-java\u003c/pluginId>\n            \u003cpluginArtifact>io.grpc:protoc-gen-grpc-java:${grpc.version}:exe:${os.detected.classifier}\u003c/pluginArtifact>\n          \u003c/configuration>\n          \u003cexecutions>\n            \u003cexecution>\n              \u003cgoals>\u003cgoal>compile\u003c/goal>\u003cgoal>compile-custom\u003c/goal>\u003c/goals>\n            \u003c/execution>\n          \u003c/executions>\n        \u003c/plugin>\n      \u003c/plugins>\n    \u003c/build>\n\u003c/project>"},"instr":{}},"c_proto":{"name":"atendimento.proto","full":"ClienteAtendimentoRPC/src/main/proto/atendimento.proto","path":"src/main/proto/atendimento.proto","proj":"ClienteAtendimentoRPC","projShort":"cliente","lang":"proto","form":false,"text":{"orig":"\nsyntax = \"proto3\";\npackage atendimento;\noption java_package =\n\"com.mycompany.atendimentorpc\";\noption java_multiple_files = true;\n\nservice AtendimentoService {\n    rpc PegarSenha (PedidoSenha)\n    returns (Senha);\n}\n\nenum TipoAtendimento {\n    NORMAL = 0;\n    PRIORITARIO = 1;\n}\n\nmessage PedidoSenha {\n    string nome = 1;\n    TipoAtendimento tipo = 2;\n    string local = 3;\n}\nmessage Senha {\n    int32 numero = 1;\n    string codigo = 2;\n    string mensagem = 3;\n}\n","enunciado":"\nsyntax = \"proto3\";\npackage atendimento;\noption java_package =\n\"com.mycompany.atendimentorpc\";\noption java_multiple_files = true;\n\nservice AtendimentoService {\n    rpc PegarSenha (PedidoSenha)\n    returns (Senha);\n}\n\n// Serviço de Nomes: guarda \"nome -> endereço\"\nservice ServicoNomes {\n    rpc Registrar (Registro) returns (Vazio);  // a Central entra ao subir\n    rpc Localizar (Nome) returns (Endereco);   // o totem pergunta antes de conectar\n    rpc Remover (Nome) returns (Vazio);        // a Central sai ao encerrar\n}\n\nenum TipoAtendimento {\n    NORMAL = 0;\n    PRIORITARIO = 1;\n}\n\nmessage PedidoSenha {\n    string nome = 1;\n    TipoAtendimento tipo = 2;\n    string local = 3;\n}\nmessage Senha {\n    int32 numero = 1;\n    string codigo = 2;\n    string mensagem = 3;\n}\n\n// Mensagens do Serviço de Nomes\nmessage Registro {\n    string nome = 1;\n    string host = 2;\n    int32 porta = 3;\n}\nmessage Nome {\n    string nome = 1;\n}\nmessage Endereco {\n    string host = 1;\n    int32 porta = 2;\n}\nmessage Vazio {}\n"},"instr":{"enunciado":"\n\u003cp>\u003cb>O que fazer:\u003c/b> deixe este arquivo \u003cb>igual\u003c/b> ao \u003cspan class=\"flink\" data-open=\"s_proto\">atendimento.proto do servidor\u003c/span> (mesmos blocos verdes). O jeito mais seguro: \u003cb>Copiar arquivo inteiro\u003c/b> e colar por cima.\u003c/p>"}},"c_clin":{"name":"ClienteNomes.java","full":"ClienteAtendimentoRPC/src/main/java/com/mycompany/atendimentorpc/ClienteNomes.java","path":"src/main/java/com/mycompany/atendimentorpc/ClienteNomes.java","proj":"ClienteAtendimentoRPC","projShort":"cliente","lang":"java","form":false,"text":{"orig":null,"enunciado":"package com.mycompany.atendimentorpc;\n\nimport io.grpc.ManagedChannel;\nimport io.grpc.ManagedChannelBuilder;\nimport java.util.concurrent.TimeUnit;\n\npublic class ClienteNomes {\n\n    // O único endereço fixo que o totem conhece: o do Serviço de Nomes\n    private static final String HOST_NOMES = \"localhost\";\n    private static final int PORTA_NOMES = 50052;\n\n    // Pergunta ao Serviço de Nomes onde está o serviço com esse nome.\n    // Nome não registrado: a chamada falha com o código NOT_FOUND.\n    public static Endereco localizar(String nome) {\n        ManagedChannel canal = ManagedChannelBuilder\n                .forAddress(HOST_NOMES, PORTA_NOMES)\n                .usePlaintext()   // sem TLS: só no laboratório\n                .build();\n        try {\n            ServicoNomesGrpc.ServicoNomesBlockingStub stub =\n                    ServicoNomesGrpc.newBlockingStub(canal);\n            return stub.withDeadlineAfter(5, TimeUnit.SECONDS)\n                    .localizar(Nome.newBuilder().setNome(nome).build());\n        } finally {\n            canal.shutdown();   // a consulta acabou: fecha a conexão\n        }\n    }\n}\n"},"instr":{"enunciado":"\u003cp>\u003cb>Como criar:\u003c/b> botão direito no pacote \u003ccode>com.mycompany.atendimentorpc\u003c/code> › \u003cb>New › Java Class…\u003c/b> › digite o nome (sem \u003ccode>.java\u003c/code>) › \u003cb>Finish\u003c/b>. Apague o que o NetBeans gerou e cole o arquivo inteiro (botão \u003cb>Copiar arquivo\u003c/b>).\u003c/p>\n\u003ch4>O que explicar\u003c/h4>\u003cul>\n\u003cli>O único endereço fixo que sobra no cliente é o do Serviço de Nomes (\u003ccode>localhost:50052\u003c/code>).\u003c/li>\n\u003cli>\u003ccode>localizar(nome)\u003c/code> abre um canal, pergunta, fecha o canal (\u003ccode>finally\u003c/code>) e devolve o \u003ccode>Endereco\u003c/code> gerado pelo \u003ccode>.proto\u003c/code>.\u003c/li>\n\u003cli>Prazo de 5 s (\u003ccode>withDeadlineAfter\u003c/code>), igual ao do \u003ccode>pegarSenha\u003c/code> da aula.\u003c/li>\u003c/ul>"}},"c_tela":{"name":"TelaTotem.java","full":"ClienteAtendimentoRPC/src/main/java/com/mycompany/atendimentorpc/TelaTotem.java","path":"src/main/java/com/mycompany/atendimentorpc/TelaTotem.java","proj":"ClienteAtendimentoRPC","projShort":"cliente","lang":"java","form":true,"text":{"orig":"\npackage com.mycompany.atendimentorpc;\n\nimport com.mycompany.atendimentorpc.AtendimentoServiceGrpc;\nimport com.mycompany.atendimentorpc.PedidoSenha;\nimport com.mycompany.atendimentorpc.Senha;\nimport com.mycompany.atendimentorpc.TipoAtendimento;\nimport io.grpc.ManagedChannel;\nimport io.grpc.ManagedChannelBuilder;\nimport io.grpc.StatusRuntimeException;\nimport java.util.concurrent.TimeUnit;\nimport javax.swing.JOptionPane;\n\n\npublic class TelaTotem extends javax.swing.JFrame {    \n    private final ManagedChannel canal;\n    private final AtendimentoServiceGrpc.AtendimentoServiceBlockingStub stub;\n    \n    public TelaTotem( /editor-fold>//GEN-END:initComponents\n\n    private void btnPegarSenhaActionPerformed(java.awt.event.ActionEvent evt) {//GEN-FIRST:event_btnPegarSenhaActionPerformed\n        String nome = tfNome.getText().trim();\n        if (nome.isEmpty()) {\n            JOptionPane.showMessageDialog(this, \"Digite seu nome.\");\n            return;\n        }\n        String local = (String) cbxLocal.getSelectedItem();\n        TipoAtendimento tipo = rbPrioritario.isSelected()\n                ? TipoAtendimento.PRIORITARIO : TipoAtendimento.NORMAL;\n        PedidoSenha pedido = PedidoSenha.newBuilder()\n                .setNome(nome).setTipo(tipo).setLocal(local).build();\n        try {\n            Senha senha = stub.withDeadlineAfter(5, TimeUnit.SECONDS)\n                    .pegarSenha(pedido);\n            lbSenha.setText(senha.getCodigo());\n            tfNome.setText(\"\");\n        } catch (StatusRuntimeException e) {\n            lbSenha.setText(\"---\");\n            JOptionPane.showMessageDialog(this,\n                    \"Falha na chamada: \" + e.getStatus().getCode());\n        }\n    }//GEN-LAST:event_btnPegarSenhaActionPerformed\n\n    private void cbxLocalActionPerformed(java.awt.event.ActionEvent evt) {//GEN-FIRST:event_cbxLocalActionPerformed\n        // TODO add your handling code here:\n    }//GEN-LAST:event_cbxLocalActionPerformed\n\n    /**\n     * @param args the command line arguments\n     */\n    public static void main(String args[]) {\n        /* Set the Nimbus look and feel */\n        //\u003ceditor-fold defaultstate=\"collapsed\" desc=\" Look and feel setting code (optional) \">\n        /* If Nimbus (introduced in Java SE 6) is not available, stay with the default look and feel.\n         * For details see http://download.oracle.com/javase/tutorial/uiswing/lookandfeel/plaf.html \n         */\n        try {\n            for (javax.swing.UIManager.LookAndFeelInfo info : javax.swing.UIManager.getInstalledLookAndFeels()) {\n                if (\"Nimb til.logging.Logger.getLogger(TelaTotem.class.getName()).log(java.util.logging.Level.SEVERE, null, ex);\n        } catch (IllegalAccessException ex) {\n            java.util.logging.Logger.getLogger(TelaTotem.class.getName()).log(java.util.logging.Level.SEVERE, null, ex);\n        } catch (javax.swing.UnsupportedLookAndFeelException ex) {\n            java.util.logging.Logger.getLogger(TelaTotem.class.getName()).log(java.util.logging.Level.SEVERE, null, ex);\n        }\n        //\u003c/editor-fold>\n\n        /* Create and display the form */\n        java.awt.EventQueue.invokeLater(new Runnable() {\n            public void run() {\n                new TelaTotem().setVisible(true);\n            }\n        });\n    }\n\n    // Variables declaration - do not modify//GEN-BEGIN:variables\n    private javax.swing.JButton btnPegarSenha;\n    private javax.swing.JComboBox\u003cString> cbxLocal;\n    private javax.swing.ButtonGroup grupoTipo;\n    private javax.swing.JLabel lbSenha;\n    private javax.swing.JLabel lblLocal;\n    private javax.swing.JLabel lblMarca;\n    private javax.swing.JLabel lblMensagem;\n    private javax.swing.JLabel lblNome;\n    private javax.swing.JLabel lblStatus;\n    private javax.swing.JLabel lblSuaSenha;\n    private javax.swing.JLabel lblTipo;\n    private javax.swing.JLabel lblTitulo;\n    private javax.swing.JPanel painelCabecalho;\n    private javax.swing.JPanel painelFundo;\n    private javax.swing.JPanel painelSenha;\n    private javax.swing.JRadioButton rbNormal;\n    private javax.swing.JRadioButton rbPrioritario;\n    private javax.swing.JTextField tfNome;\n    // End of variables declaration//GEN-END:variables\n}\n"},"instr":{"enunciado":"\n\u003cp>\u003cb>O que fazer:\u003c/b> \u003cb>não\u003c/b> substitua o arquivo inteiro: o NetBeans protege o código gerado da tela (o bloco cinza \u003ci>Generated Code\u003c/i>). Selecione o construtor \u003ccode>public TelaTotem() { … }\u003c/code> e cole por cima (\u003cb>Copiar construtor + localizarCentral()\u003c/b>). O método novo fica logo abaixo do construtor.\u003c/p>\n\u003ch4>O que muda\u003c/h4>\u003cul>\n\u003cli>\u003cspan style=\"color:var(--modText);font-weight:700\">1 linha âmbar:\u003c/span> \u003ccode>.forAddress(\"localhost\", 50051)\u003c/code> vira \u003ccode>.forAddress(central.getHost(), central.getPorta())\u003c/code>. Clique na barra âmbar para ver a linha original.\u003c/li>\n\u003cli>\u003cspan style=\"color:var(--addText);font-weight:700\">Verdes:\u003c/span> pergunta ao Serviço de Nomes antes de conectar; o rodapé do totem mostra o endereço que veio do registro.\u003c/li>\n\u003cli>\u003ccode>localizarCentral()\u003c/code>: se der \u003ccode>NOT_FOUND\u003c/code> (ninguém registrou) ou \u003ccode>UNAVAILABLE\u003c/code> (Serviço de Nomes fora do ar), mostra uma mensagem e fecha o totem.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>Endereco\u003c/code> e \u003ccode>ClienteNomes\u003c/code> estão no mesmo pacote: não precisa de import novo.\u003c/p>"},"snips":{"enunciado":[{"label":"Copiar construtor + localizarCentral()","text":"    public TelaTotem() {\n        initComponents();\n        Endereco central = localizarCentral();   // pergunta ao Serviço de Nomes\n        canal = ManagedChannelBuilder\n                .forAddress(central.getHost(), central.getPorta())\n                .usePlaintext()   // sem TLS: só no laboratório\n                .build();\n        stub = AtendimentoServiceGrpc.newBlockingStub(canal);\n        lblStatus.setText(\"Central \\\"atendimento\\\": \"\n                + central.getHost() + \":\" + central.getPorta());\n        Runtime.getRuntime().addShutdownHook(new Thread(canal::shutdown));\n    }\n\n    // Descobre a Central pelo nome \"atendimento\" antes de conectar\n    private Endereco localizarCentral() {\n        try {\n            return ClienteNomes.localizar(\"atendimento\");\n        } catch (StatusRuntimeException e) {\n            // NOT_FOUND: ninguém registrou o nome; UNAVAILABLE: Serviço de Nomes fora do ar\n            JOptionPane.showMessageDialog(this,\n                    \"Central não localizada: \" + e.getStatus().getCode());\n            System.exit(1);   // sem endereço, o totem não tem a quem pedir senha\n            throw e;          // nunca executa; só para o compilador\n        }\n    }"}]}},"c_teste":{"name":"TesteNomes.java","full":"ClienteAtendimentoRPC/src/main/java/com/mycompany/atendimentorpc/TesteNomes.java","path":"src/main/java/com/mycompany/atendimentorpc/TesteNomes.java","proj":"ClienteAtendimentoRPC","projShort":"cliente","lang":"java","form":false,"text":{"orig":null,"enunciado":"package com.mycompany.atendimentorpc;\n\nimport io.grpc.ManagedChannel;\nimport io.grpc.ManagedChannelBuilder;\nimport io.grpc.StatusRuntimeException;\nimport java.util.concurrent.TimeUnit;\n\n// Testes do Serviço de Nomes: botão direito no arquivo > Run File (Shift+F6)\npublic class TesteNomes {\n\n    public static void main(String[] args) {\n        // Um nome registrado e um que ninguém registrou\n        localizar(\"atendimento\");\n        localizar(\"financeiro\");\n\n        // forTarget: o próprio gRPC resolve o nome DNS \"localhost\" em IP\n        ManagedChannel canal = ManagedChannelBuilder\n                .forTarget(\"dns:///localhost:50051\")\n                .usePlaintext()\n                .build();\n        try {\n            Senha senha = AtendimentoServiceGrpc.newBlockingStub(canal)\n                    .withDeadlineAfter(5, TimeUnit.SECONDS)\n                    .pegarSenha(PedidoSenha.newBuilder()\n                            .setNome(\"Teste DNS\").setLocal(\"TesteNomes\").build());\n            System.out.println(\"forTarget dns:///localhost:50051 -> senha \"\n                    + senha.getCodigo());\n        } catch (StatusRuntimeException e) {\n            System.out.println(\"forTarget dns:///localhost:50051 -> \"\n                    + e.getStatus().getCode());\n        } finally {\n            canal.shutdown();\n        }\n    }\n\n    private static void localizar(String nome) {\n        try {\n            Endereco endereco = ClienteNomes.localizar(nome);\n            System.out.println(\"Localizar \\\"\" + nome + \"\\\" -> \"\n                    + endereco.getHost() + \":\" + endereco.getPorta());\n        } catch (StatusRuntimeException e) {\n            System.out.println(\"Localizar \\\"\" + nome + \"\\\" -> \"\n                    + e.getStatus().getCode());\n        }\n    }\n}\n"},"instr":{"enunciado":"\u003cp>\u003cb>Como criar:\u003c/b> botão direito no pacote \u003ccode>com.mycompany.atendimentorpc\u003c/code> › \u003cb>New › Java Class…\u003c/b> › digite o nome (sem \u003ccode>.java\u003c/code>) › \u003cb>Finish\u003c/b>. Apague o que o NetBeans gerou e cole o arquivo inteiro (botão \u003cb>Copiar arquivo\u003c/b>).\u003c/p>\n\u003cp>Roda com botão direito › \u003cb>Run File\u003c/b> (Shift+F6). Faz os testes 2, 3 e 4 da aba \u003cb>Testes\u003c/b>:\u003c/p>\u003cul>\n\u003cli>\u003ccode>localizar(\"atendimento\")\u003c/code> → \u003ccode>localhost:50051\u003c/code> (ou \u003ccode>NOT_FOUND\u003c/code> depois que a Central saiu).\u003c/li>\n\u003cli>\u003ccode>localizar(\"financeiro\")\u003c/code> → \u003ccode>NOT_FOUND\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>forTarget(\"dns:///localhost:50051\")\u003c/code>: aqui quem resolve o nome não é o nosso registro, é o \u003cb>resolvedor DNS do próprio gRPC\u003c/b>. Ele transforma \u003ccode>localhost\u003c/code> em IP e o totem pega uma senha.\u003c/li>\u003c/ul>"}},"c_pom":{"name":"pom.xml","full":"ClienteAtendimentoRPC/pom.xml","path":"pom.xml","proj":"ClienteAtendimentoRPC","projShort":"cliente","lang":"xml","form":false,"text":{"orig":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    \u003cmodelVers u003c/groupId>\n          \u003cartifactId>protobuf-maven-plugin\u003c/artifactId>\n          \u003cversion>0.6.1\u003c/version>\n          \u003cconfiguration>\n            \u003cprotocArtifact>com.google.protobuf:protoc:${protobuf.version}:exe:${os.detected.classifier}\u003c/protocArtifact>\n            \u003cpluginId>grpc-java\u003c/pluginId>\n            \u003cpluginArtifact>io.grpc:protoc-gen-grpc-java:${grpc.version}:exe:${os.detected.classifier}\u003c/pluginArtifact>\n          \u003c/configuration>\n          \u003cexecutions>\n            \u003cexecution>\n              \u003cgoals>\u003cgoal>compile\u003c/goal>\u003cgoal>compile-custom\u003c/goal>\u003c/goals>\n            \u003c/execution>\n          \u003c/executions>\n        \u003c/plugin>\n      \u003c/plugins>\n    \u003c/build>\n\u003c/project>","enunciado":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    \u003cmodelVersion>4.0.0\u003c/modelVersion>\n    \u003cgroupId>com.mycompany\u003c/groupId>\n    \u003cartifactId>ClienteAtendimentoRPC\u003c/artifactId>\n    \u003cversion>1.0-SNAPSHOT\u003c/version>\n    \u003cpackaging>jar\u003c/packaging>\n    \u003cproperties>\n        \u003cproject.build.sourceEncoding>UTF-8\u003c/project.build.sourceEncoding>\n        \u003cmaven.compiler.release>25\u003c/maven.compiler.release>\n        \u003cexec.mainClass>com.mycompany.atendimentorpc.TelaTotem\u003c/exec.mainClass>\n        \u003cgrpc.version>1.75.0\u003c/grpc.version>\n        \u003cprotobuf.version>3.25.5\u003c/protobuf.version>        \n    \u003c/properties>\n    \u003cname>ClienteAtendimentoRPC\u003c/name>\n    \u003cdependencies>\n    \u003cdependency>\n      \u003cgroupId>io.grpc\u003c/groupId>\n      \u003cartifactId>grpc-netty-shaded\u003c/artifactId>\n      \u003cversion>${grpc.version}\u003c/version>\n    \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-protobuf\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>io.grpc\u003c/groupId>\n          \u003cartifactId>grpc-stub\u003c/artifactId>\n          \u003cversion>${grpc.version}\u003c/version>\n        \u003c/dependency>\n        \u003cdependency>\n          \u003cgroupId>javax.annotation\u003c/groupId>\n          \u003cartifactId>javax.annotation-api\u003c/artifactId>\n          \u003cversion>1.3.2\u003c/version>\n        \u003c/dependency>\n      \u003c/dependencies>    \n    \u003cbuild>\n      \u003cextensions>\n        \u003cextension>\n          \u003cgroupId>kr.motd.maven\u003c/groupId>\n          \u003cartifactId>os-maven-plugin\u003c/artifactId>\n          \u003cversion>1.7.1\u003c/version>\n        \u003c/extension>\n      \u003c/extensions>\n      \u003cplugins>\n        \u003cplugin>\n          \u003cgroupId>org.xolstice.maven.plugins\u003c/groupId>\n          \u003cartifactId>protobuf-maven-plugin\u003c/artifactId>\n          \u003cversion>0.6.1\u003c/version>\n          \u003cconfiguration>\n            \u003cprotocArtifact>com.google.protobuf:protoc:${protobuf.version}:exe:${os.detected.classifier}\u003c/protocArtifact>\n            \u003cpluginId>grpc-java\u003c/pluginId>\n            \u003cpluginArtifact>io.grpc:protoc-gen-grpc-java:${grpc.version}:exe:${os.detected.classifier}\u003c/pluginArtifact>\n          \u003c/configuration>\n          \u003cexecutions>\n            \u003cexecution>\n              \u003cgoals>\u003cgoal>compile\u003c/goal>\u003cgoal>compile-custom\u003c/goal>\u003c/goals>\n            \u003c/execution>\n          \u003c/executions>\n        \u003c/plugin>\n      \u003c/plugins>\n    \u003c/build>\n\u003c/project>"},"instr":{}}},"tree":[{"name":"ServidorAtendimentoRPC","groups":[{"name":"Source Packages","icon":"folder","sub":{"name":"com.mycompany.servidoratendimentorpc","icon":"pkg"},"items":["s_impl","s_nomes","s_main","s_srvnom"]},{"name":"Other Sources","icon":"folder","sub":{"name":"src/main/proto","icon":"folder"},"items":["s_proto"]},{"name":"Generated Sources (protobuf)","icon":"gen","hint":"gerado pelo Maven"},{"name":"Dependencies","icon":"lib"},{"name":"Project Files","icon":"folder","items":["s_pom"],"collapsed":true}]},{"name":"ClienteAtendimentoRPC","groups":[{"name":"Source Packages","icon":"folder","sub":{"name":"com.mycompany.atendimentorpc","icon":"pkg"},"items":["c_clin","c_tela","c_teste"]},{"name":"Other Sources","icon":"folder","sub":{"name":"src/main/proto","icon":"folder"},"items":["c_proto"]},{"name":"Generated Sources (protobuf)","icon":"gen","hint":"gerado pelo Maven"},{"name":"Dependencies","icon":"lib"},{"name":"Project Files","icon":"folder","items":["c_pom"],"collapsed":true}]}],"testsHtml":{"enunciado":"\u003ch3>Testes (Trabalho 5 — Serviço de nomes)\u003c/h3>\u003cp style=\"color:var(--muted)\">Os testes vêm do slide \"TRABALHO 5\" do PDF da Aula 10. Resultados conferidos compilando e rodando o projeto.\u003c/p>\u003ctable class=\"tests\">\u003ctr>\u003cth>#\u003c/th>\u003cth>Teste\u003c/th>\u003cth>Como\u003c/th>\u003cth>Resultado real\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Totens 1, 2 e 3 localizam \"atendimento\" e pegam senhas da mesma fila\u003c/td>\u003ctd>TelaTotem 3× (Run File)\u003c/td>\u003ctd>Central: \u003ccode>N-001\u003c/code> Biblioteca, \u003ccode>P-002\u003c/code> Central de Relacionamento, \u003ccode>N-003\u003c/code> Financeiro\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Localizar \"financeiro\" → NOT_FOUND\u003c/td>\u003ctd>TesteNomes\u003c/td>\u003ctd>\u003ccode>Localizar \"financeiro\" -&gt; NOT_FOUND\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Encerrar o \"atendimento\" → sai do registro\u003c/td>\u003ctd>ENTER na Central, TesteNomes de novo\u003c/td>\u003ctd>\u003ccode>Removido: atendimento\u003c/code> → \u003ccode>Localizar \"atendimento\" -&gt; NOT_FOUND\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Conectar pelo nome, via DNS, com forTarget\u003c/td>\u003ctd>TesteNomes\u003c/td>\u003ctd>\u003ccode>forTarget dns:///localhost:50051 -&gt; senha N-004\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>+\u003c/td>\u003ctd>\u003ci>Extra:\u003c/i> a Central cai sem avisar (Stop)\u003c/td>\u003ctd>Stop na Central, TesteNomes\u003c/td>\u003ctd>Localizar ainda devolve \u003ccode>localhost:50051\u003c/code>, mas a conexão dá \u003ccode>UNAVAILABLE\u003c/code>\u003c/td>\u003c/tr>\u003c/table>\u003ch4>O que a professora pede para explicar\u003c/h4>\u003cul>\n\u003cli>\u003cb>Como o gRPC transforma um nome em IP e porta:\u003c/b> o canal recebe um \u003ci>target\u003c/i> no formato URI (\u003ccode>esquema:///nome:porta\u003c/code>). O resolvedor do esquema (DNS, se nenhum for dito) devolve a lista de endereços, e a política de balanceamento escolhe um. O nosso mini-registro faz esse papel \"na mão\", antes de criar o canal.\u003cbr>\u003cspan style=\"color:var(--muted)\">Fonte: grpc.io/docs/guides/custom-name-resolution (seções \u003ci>Overview\u003c/i> e \u003ci>Life of a Target String\u003c/i>)\u003c/span>\u003c/li>\n\u003cli>\u003cb>Quando usar:\u003c/b> quando o endereço muda (Central trocou de máquina ou porta) ou quando há várias cópias da Central.\u003c/li>\n\u003cli>\u003cb>Rede real:\u003c/b> DNS; no Kubernetes cada Service ganha um nome DNS (ex.: \u003ccode>atendimento.default.svc.cluster.local\u003c/code>); com vários endereços para o mesmo nome, a política \u003ccode>round_robin\u003c/code> reparte as chamadas entre eles.\u003c/li>\n\u003cli>\u003cb>Por que quem cai precisa sair do registro:\u003c/b> senão o registro entrega um endereço morto e o totem só descobre na hora da chamada (\u003ccode>UNAVAILABLE\u003c/code>). Registros de verdade usam verificação de saúde ou expiração.\u003cbr>\u003cspan style=\"color:var(--muted)\">Fonte dos códigos: grpc.io/docs/guides/status-codes (NOT_FOUND e UNAVAILABLE)\u003c/span>\u003c/li>\u003c/ul>"},"helpHtml":{"enunciado":"\u003ch3>Problemas comuns\u003c/h3>\u003cul>\n\u003cli>\u003cb>A Central encerra logo ao subir com \u003ccode>UNAVAILABLE\u003c/code>:\u003c/b> o \u003cb>ServidorNomes\u003c/b> não está rodando. Rode ele primeiro (Run File).\u003c/li>\n\u003cli>\u003cb>Totem mostra \"Central não localizada: NOT_FOUND\":\u003c/b> a Central não está registrada (não subiu, ou alguém apertou ENTER nela).\u003c/li>\n\u003cli>\u003cb>Totem mostra \"Central não localizada: UNAVAILABLE\":\u003c/b> o ServidorNomes está fora do ar.\u003c/li>\n\u003cli>\u003cb>ENTER não faz nada:\u003c/b> clique dentro da aba de Output \u003cb>da Central\u003c/b> (ServidorAtendimentoRPC) antes de apertar ENTER.\u003c/li>\n\u003cli>\u003cb>Linhas WARNING sobre \u003ccode>sun.misc.Unsafe\u003c/code>\u003c/b> no Output: vêm do Netty no JDK novo. Pode ignorar.\u003c/li>\n\u003cli>\u003cb>Classes do .proto não aparecem / \"cannot find symbol\":\u003c/b> Clean and Build nos dois projetos. Persistiu: apague \u003ccode>target\u003c/code> (aba Files) e repita.\u003c/li>\n\u003cli>\u003cb>\"Address already in use\"\u003c/b> (porta 50051 ou 50052 ocupada): já tem uma execução antiga rodando. Pare as execuções antigas no Output (quadrado vermelho) e rode de novo.\u003c/li>\n\u003cli>\u003cb>Os dois \u003ccode>.proto\u003c/code> estão iguais?\u003c/b> Qualquer diferença entre cliente e servidor quebra a chamada.\u003c/li>\n\u003cli>\u003cb>Máquinas diferentes:\u003c/b> troque \u003ccode>localhost\u003c/code> pelo IP do servidor no registro (\u003ccode>setHost\u003c/code>) e em \u003ccode>HOST_NOMES\u003c/code> do ClienteNomes.\u003c/li>\u003c/ul>"}}</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------------- diff (LCS por linha, ignora espaços no fim) ---------------- */
function diffLines(a, b){
  const A = a.map(s => s.replace(/\s+$/,'')), B = b.map(s => s.replace(/\s+$/,''));
  const n = A.length, m = B.length;
  const L = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const ops = []; let i=0, j=0;
  while (i<n && j<m){
    if (A[i]===B[j]) { ops.push({t:'=', a:i, b:j}); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) { ops.push({t:'-', a:i}); i++; }
    else { ops.push({t:'+', b:j}); j++; }
  }
  while (i<n) ops.push({t:'-', a:i++});
  while (j<m) ops.push({t:'+', b:j++});
  return ops;
}
function bigrams(s){ s = s.trim(); const r = new Map(); for (let i=0;i<s.length-1;i++){ const g=s.substr(i,2); r.set(g,(r.get(g)||0)+1);} return r; }
function sim(x, y){
  x = x.trim(); y = y.trim(); if (!x && !y) return 1; if (!x || !y) return 0;
  const X = bigrams(x), Y = bigrams(y); let inter = 0, tot = 0;
  X.forEach((v,k) => { inter += Math.min(v, Y.get(k)||0); tot += v; }); Y.forEach(v => tot += v);
  return tot ? 2*inter/tot : 0;
}
/* Classifica as linhas do arquivo novo (b): '' igual, 'a' nova, 'm' alterada (com old), e marca remoções */
function classify(aLines, bLines){
  const ops = diffLines(aLines, bLines);
  const rows = bLines.map(t => ({t, s:'', old:null, delBefore:null}));
  let k = 0, removedTail = null;
  while (k < ops.length){
    if (ops[k].t === '='){ k++; continue; }
    const dels = [], ins = [];
    while (k < ops.length && ops[k].t !== '='){ if (ops[k].t==='-') dels.push(ops[k].a); else ins.push(ops[k].b); k++; }
    const used = new Set(), pairs = new Map();
    let from = 0;
    const limiar = dels.length === ins.length ? 0.12 : 0.35;  // troca 1 por 1 = linha alterada
    dels.forEach(di => {
      let best = -1, bs = limiar;
      for (let x=from; x<ins.length; x++){ const v = sim(aLines[di], bLines[ins[x]]); if (v > bs){ bs = v; best = x; } }
      if (best >= 0){ pairs.set(ins[best], di); used.add(di); from = best+1; }
    });
    ins.forEach(bi => { if (pairs.has(bi)){ rows[bi].s='m'; rows[bi].old = aLines[pairs.get(bi)]; } else rows[bi].s='a'; });
    const lost = dels.filter(d => !used.has(d)).map(d => aLines[d]);
    if (lost.length){
      const at = ins.length ? ins[0] : (k < ops.length ? ops[k].b : null);
      if (at === null || at === undefined) removedTail = lost; else rows[at].delBefore = (rows[at].delBefore||[]).concat(lost);
    }
  }
  return {rows, removedTail};
}

/* ---------------- realce de sintaxe ---------------- */
const KW = {
  java: new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var true false null record'.split(' ')),
  proto: new Set('syntax package option import service rpc returns message enum repeated optional reserved stream string int32 int64 uint32 uint64 bool bytes double float map oneof true false'.split(' '))
};
function hl(line, lang, st){
  if (lang === 'xml') return hlXml(line);
  let out = '', i = 0; const n = line.length; const kw = KW[lang] || KW.java;
  let prevWord = '';
  if (st.inC){
    const e = line.indexOf('*/');
    if (e < 0) return '<span class="c">'+esc(line)+'</span>';
    out += '<span class="c">'+esc(line.slice(0,e+2))+'</span>'; i = e+2; st.inC = false;
  }
  while (i < n){
    const ch = line[i], rest = line.slice(i);
    if (rest.startsWith('//')){ out += '<span class="c">'+esc(rest)+'</span>'; break; }
    if (rest.startsWith('/*')){
      const e = line.indexOf('*/', i+2);
      if (e < 0){ out += '<span class="c">'+esc(rest)+'</span>'; st.inC = true; break; }
      out += '<span class="c">'+esc(line.slice(i,e+2))+'</span>'; i = e+2; continue;
    }
    if (ch === '"' || ch === "'"){
      let j = i+1; while (j < n && line[j] !== ch){ if (line[j]==='\\') j++; j++; }
      out += '<span class="s">'+esc(line.slice(i,j+1))+'</span>'; i = j+1; continue;
    }
    if (ch === '@' && /[A-Za-z]/.test(line[i+1]||'')){
      const m = /^@[A-Za-z_]\w*/.exec(rest); out += '<span class="an">'+esc(m[0])+'</span>'; i += m[0].length; continue;
    }
    if (/[0-9]/.test(ch) && !/[\w]/.test(line[i-1]||'')){
      const m = /^\d+[\w.]*/.exec(rest); out += '<span class="nu">'+esc(m[0])+'</span>'; i += m[0].length; continue;
    }
    if (/[A-Za-z_$]/.test(ch)){
      const m = /^[A-Za-z_$][\w$]*/.exec(rest); const w = m[0];
      if (kw.has(w)) out += '<span class="k">'+w+'</span>';
      else if (/^(class|interface|enum|service|message|rpc)$/.test(prevWord)) out += '<span class="dc">'+w+'</span>';
      else out += esc(w);
      prevWord = w; i += w.length; continue;
    }
    if (!/\s/.test(ch)) prevWord = '';
    out += esc(ch); i++;
  }
  return out;
}
/* Uma passada só sobre o texto cru: substituições em cadeia casariam com o HTML que elas mesmas inserem */
function hlXml(line){
  const re = /(<!--.*?-->)|(<\/?)([\w:.-]+)|([\w:-]+)=("[^"]*")|(\$\{[^}]+\})/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    if (m[1]) out += '<span class="c">'+esc(m[1])+'</span>';
    else if (m[2]) out += esc(m[2])+'<span class="xt">'+esc(m[3])+'</span>';
    else if (m[4]) out += '<span class="xa">'+esc(m[4])+'</span>=<span class="s">'+esc(m[5])+'</span>';
    else out += '<span class="s">'+esc(m[6])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}

/* ---------------- estado ---------------- */
const LS = k => { try { return localStorage.getItem('gsn.'+k); } catch(e){ return null; } };
const SS = (k,v) => { try { localStorage.setItem('gsn.'+k, v); } catch(e){} };
const state = { ver: D.defaultVersion, open: [], cur: null, btab: 'instr', out: 0, folds: {} };
const theme = LS('theme'); if (theme) document.documentElement.setAttribute('data-theme', theme);

function V(){ return D.versions[state.ver]; }
function fileStatus(ver, id){
  const f = D.files[id];
  const t = f.text[ver];
  if (t == null) return 'ausente';
  if (f.text.orig == null) return 'novo';
  return t.replace(/\s+$/gm,'') === f.text.orig.replace(/\s+$/gm,'') ? 'igual' : 'alterado';
}
function statusOf(id){ return fileStatus(state.ver, id); }
function visible(id){ return statusOf(id) !== 'ausente'; }
